<title>One Open Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;600&display=swap">
<style>
/* Layout: a 1.85:1 film frame on top, a typewritten "what's happening" panel and actions beneath. Single dark screening-room look by choice. */
:root {
  --black: #0b0a09;
  --slate: #e9e1cf;
  --dim: #8d8473;
  --rust: #b5653a;
  --line: #2a2621;
  --paper: #e6dcc4;
  --ink: #2a2621;
  --slate-face: "Courier Prime", "Courier New", Courier, monospace;
  --ui-face: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --glass: #0c121b; --glass-2: #141c28; --phone-ink: #eef3ff; --phone-dim: #8995ab; --me: #2f6fdd; --them: #262c36;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { background: var(--black); }
body {
  margin: 0; background: var(--black); color: var(--slate); font-family: var(--ui-face);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-inline: 16px; padding-block: 12px 24px; box-sizing: border-box; min-height: 100%;
}
.col { width: min(100%, calc((64vh - 170px) * 1.85)); min-width: min(100%, 560px); max-width: 100%; }
#stage { position: relative; aspect-ratio: 1.85 / 1; background: #000; overflow: hidden; }
#stage canvas { display: block; width: 100%; height: 100%; }
#hud { position: absolute; left: 3%; top: 5%; font-family: var(--slate-face); font-size: clamp(11px, 1.35vw, 16px); line-height: 1.35; text-shadow: 0 1px 2px rgba(0,0,0,.7); pointer-events: none; }
#hud .place { text-transform: uppercase; letter-spacing: .05em; }
#hud .sub { color: #cfc6b1; font-size: .85em; }
#hud-r { position: absolute; right: 3%; top: 5%; font-family: var(--slate-face); font-size: clamp(10px, 1.2vw, 14px); text-align: right; text-shadow: 0 1px 2px rgba(0,0,0,.7); line-height: 1.5; pointer-events: none; font-variant-numeric: tabular-nums; }
#subs {
  position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); width: min(84%, 48ch);
  text-align: center; font-weight: 600; font-size: clamp(13px, 1.7vw, 20px); color: #fbf6e8; line-height: 1.3;
  text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9); pointer-events: none;
}
#subs .who { display: block; font-family: var(--slate-face); font-weight: 400; font-size: .7em; color: #d9cfb8; letter-spacing: .06em; text-transform: uppercase; }
#subs.me { color: #c9c0aa; font-weight: 400; font-style: italic; }
#card {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 12px;
  padding: 0 4% 6%; background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.72)); font-family: var(--slate-face);
}
#card.solid { background: rgba(8,7,6,.94); justify-content: center; }
#card .time { color: var(--dim); letter-spacing: .06em; font-size: clamp(11px, 1.3vw, 15px); }
#card h1 { margin: 0; font-weight: 400; font-size: clamp(22px, 3.6vw, 44px); letter-spacing: .02em; text-wrap: balance; }
#card p { margin: 0; max-width: 52ch; font-size: clamp(13px, 1.6vw, 18px); line-height: 1.45; text-wrap: pretty; white-space: pre-line; }
#card .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
#toast {
  position: absolute; left: 50%; top: 4%; transform: translateX(-50%); width: min(92%, 360px);
  background: rgba(20,28,40,.92); color: var(--phone-ink); border-radius: 14px; padding: 9px 13px; font-size: 13px; line-height: 1.35;
  box-shadow: 0 0 30px rgba(70,120,255,.25); cursor: pointer; z-index: 3;
}
#toast b { display: block; font-size: 12px; color: var(--phone-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
#panel { display: flex; flex-direction: column; gap: 10px; }
#desc { font-family: var(--slate-face); font-size: 15px; line-height: 1.55; max-width: 72ch; min-height: 3em; text-wrap: pretty; }
#desc .event { display: block; margin-top: 6px; color: #e8b48a; }
#desc .closer { display: block; margin-top: 6px; color: #cfc6b1; }
#desc.loading { color: var(--dim); }
#acts { display: flex; flex-wrap: wrap; gap: 6px; }
#acts .sep { flex-basis: 100%; height: 0; }
#acts .lbl { font-family: var(--slate-face); font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; align-self: center; margin-right: 2px; }
button {
  font-family: var(--slate-face); font-size: 13px; color: #c8bfa9; background: transparent; border: 1px solid #3a342c;
  padding: 7px 11px; cursor: pointer; letter-spacing: .03em;
}
button:hover:not(:disabled) { color: var(--slate); border-color: var(--dim); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
button.primary { color: var(--slate); border-color: var(--rust); }
button.person { color: var(--slate); border-color: #5a4a3a; }
button[aria-pressed="true"] { color: var(--slate); border-color: var(--rust); }
.badge { display: inline-block; min-width: 16px; padding: 0 4px; margin-left: 6px; border-radius: 8px; background: var(--me); color: #fff; font-size: 11px; line-height: 16px; text-align: center; font-family: var(--ui-face); }
#say, #do { display: flex; flex-wrap: wrap; gap: 8px; }
#say input, #do input { flex: 1; min-width: 0; background: transparent; color: var(--slate); border: 1px solid #3a342c; padding: 9px 12px; font-family: var(--slate-face); font-size: 15px; }
#say input:focus, #do input:focus { outline: none; border-color: var(--rust); }
#mind { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#mind .lbl { font-family: var(--slate-face); font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-right: 2px; }
#mind .need { border-style: dashed; border-color: #6a5a44; color: #e0d4b8; font-size: 12px; padding: 5px 9px; }
#mind .need.soon { border-color: var(--rust); color: #f0c49a; }
#mind .plan { font-family: var(--slate-face); font-size: 12px; color: #a8b48a; padding: 5px 2px; }
#note { font-family: var(--slate-face); font-size: 12px; color: #f0b27a; }
#note:empty { display: none; }
#controls { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; font-family: var(--slate-face); font-size: 12px; color: var(--dim); }
#controls .group { display: flex; gap: 6px; flex-wrap: wrap; }
#controls button { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 9px; }
#scrim { position: fixed; inset: 0; background: rgba(5,6,9,.6); z-index: 5; }
/* the phone */
#phone {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8;
  width: min(340px, calc(100vw - 32px)); height: min(640px, calc(100% - 32px));
  background: var(--glass); color: var(--phone-ink); border-radius: 38px; border: 7px solid #050608;
  box-shadow: 0 0 60px rgba(70,120,255,.28), 0 0 0 1px #2a3140; display: flex; flex-direction: column; overflow: hidden;
  font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
#phone .bar { display: flex; justify-content: space-between; padding: 12px 22px 4px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
#phone .head { display: flex; align-items: center; gap: 8px; padding: 6px 12px 10px; border-bottom: 1px solid #1e2532; background: var(--glass-2); min-height: 30px; }
#phone .head h2 { margin: 0; font-size: 17px; flex: 1; text-align: center; }
#phone .head button { color: var(--me); border: 0; font-size: 22px; padding: 0 6px; font-family: inherit; line-height: 1; }
#phone .head .spacer { width: 30px; }
#contacts { flex: 1; overflow-y: auto; min-height: 0; }
#contacts button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #1a212d; padding: 11px 16px; color: var(--phone-ink); font-family: inherit; font-size: 15px; letter-spacing: 0; }
#contacts button span { color: var(--phone-dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#contacts button:hover { background: #121a26; }
#contacts .empty { padding: 20px; color: var(--phone-dim); font-size: 13px; }
#thread { flex: 1; overflow-y: auto; padding: 12px 12px 6px; display: flex; flex-direction: column; gap: 3px; min-height: 0; }
.daymark { text-align: center; font-size: 11px; color: var(--phone-dim); margin: 10px 0 6px; }
.msg { max-width: 76%; padding: 7px 12px; border-radius: 18px; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.them { align-self: flex-start; background: var(--them); }
.msg.me { align-self: flex-end; background: var(--me); color: #fff; }
.msg.me + .msg.them, .msg.them + .msg.me { margin-top: 8px; }
.receipt { align-self: flex-end; font-size: 11px; color: var(--phone-dim); margin: 2px 4px 4px; }
.typing { align-self: flex-start; background: var(--them); border-radius: 18px; padding: 10px 14px; display: flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--phone-dim); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 60%, 100% { opacity: .3 } 30% { opacity: 1 } }
#compose { display: flex; gap: 8px; padding: 8px 10px 14px; align-items: flex-end; }
#compose textarea { flex: 1; min-width: 0; resize: none; background: #1a212d; color: var(--phone-ink); border: 1px solid #2a3343; border-radius: 18px; padding: 8px 12px; font-size: 15px; line-height: 1.3; font-family: inherit; max-height: 96px; }
#compose textarea:focus { outline: none; border-color: var(--me); }
#send { width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0; background: var(--me); color: #fff; font-size: 18px; flex: none; font-family: inherit; }
#send:disabled { background: #2a3343; color: var(--phone-dim); }
#phone-note { font-size: 12px; color: #f0b27a; text-align: center; padding: 0 16px 8px; }
/* the map: a folded paper street map */
#mapbox {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8; width: min(760px, calc(100vw - 32px));
  max-height: calc(100% - 32px); overflow: auto; background: var(--paper); color: var(--ink); padding: 16px; box-sizing: border-box;
  box-shadow: 0 10px 50px rgba(0,0,0,.6); font-family: var(--slate-face);
}
#mapbox header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
#mapbox h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
#mapbox button { color: var(--ink); border-color: #9a8e74; }
#mapbox button:hover:not(:disabled) { color: #000; border-color: var(--ink); }
#mapbox button.primary { border-color: var(--rust); color: #000; }
#map-svg { width: 100%; height: auto; display: block; background: #ddd2b6; }
#map-svg .place { cursor: pointer; }
#map-svg text { font-family: var(--slate-face); fill: var(--ink); }
#map-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; margin-top: 10px; }
#map-list button { text-align: left; display: flex; flex-direction: column; gap: 2px; }
#map-list button small { color: #6a6050; font-size: 11px; }
#map-list button.here { border-style: dashed; }
/* their side */
#thoughts {
  position: fixed; z-index: 9; left: 16px; top: 16px; width: min(290px, calc(100vw - 32px)); max-height: calc(100% - 32px); overflow: auto;
  font-family: var(--slate-face); font-size: 13px; color: var(--slate); line-height: 1.4;
  background: rgba(11,10,9,.9); border: 1px solid var(--line); padding: 12px 14px; box-sizing: border-box;
}
#thoughts .label { color: var(--dim); text-transform: uppercase; font-size: 11px; letter-spacing: .08em; margin-top: 8px; }
#thoughts .label:first-child { margin-top: 0; }
#thoughts .meter { height: 4px; background: var(--line); margin: 5px 0 4px; }
#thoughts .meter b { display: block; height: 100%; background: var(--rust); transition: width .8s ease; }
#thoughts .meter b.alt { background: #8a9a6a; }
#thoughts ul { margin: 4px 0 0; padding-left: 18px; }
#log { max-height: 36vh; min-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; padding-right: 8px; font-family: var(--slate-face); font-size: 15px; line-height: 1.5; }
.tx { max-width: 74ch; text-wrap: pretty; }
.tx.place { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.tx.place:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
.tx.desc, .tx.gm { color: var(--slate); }
.tx.gm.no { color: #c9b08a; }
.tx.you { color: #cfc6b1; }
.tx.you .tag { display: inline-block; font-size: 10px; letter-spacing: .1em; padding: 0 5px; margin-right: 8px; border: 1px solid #6a5a44; color: #e0d4b8; line-height: 16px; vertical-align: 1px; }
.tag.said { border-color: #5a6a8a; color: #b8c8e8; }
.tag.thought { border-style: dashed; color: #a8a090; }
.tx.you.considered { opacity: .55; }
.tx.npc { color: #fbf6e8; }
.tx.npc b { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #d9cfb8; }
.tx.think { color: #a8a090; font-style: italic; border-left: 2px solid #3a342c; padding-left: 10px; }
.tx.event { color: #e8b48a; }
.tx.phone { color: #b8c8e8; cursor: pointer; }
.tx.phone b { font-weight: 400; color: #8995ab; }
.tx.phone:hover { color: #dce6ff; }
.tx.sys { color: var(--dim); font-size: 13px; }
.tx.mind { color: #d8c49a; font-size: 13px; }
.tx.prompt { color: #f0d0a8; border: 1px dashed #6a5a44; padding: 8px 10px; }
.tx .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
#here { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#here .lbl, #sheet .head { font-family: var(--slate-face); font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-right: 2px; }
#here .instruments { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
#cmd { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
#modes { display: flex; }
#modes button { border-right-width: 0; }
#modes button:last-child { border-right-width: 1px; }
#cmd input { flex: 1; min-width: 180px; background: transparent; color: var(--slate); border: 1px solid #3a342c; padding: 9px 12px; font-family: var(--slate-face); font-size: 15px; }
#cmd input:focus { outline: none; border-color: var(--rust); }
.badge.warn { background: var(--rust); }
#sheet {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8; width: min(440px, calc(100vw - 32px)); max-height: calc(100% - 32px); overflow: auto;
  background: var(--paper); color: var(--ink); padding: 16px; box-sizing: border-box; box-shadow: 0 10px 50px rgba(0,0,0,.6); font-family: var(--slate-face);
}
#sheet header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
#sheet h2 { margin: 0; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; }
#sheet button { color: var(--ink); border-color: #9a8e74; }
#sheet #sheet-body { display: flex; flex-direction: column; gap: 6px; }
#sheet .row { font-size: 14px; }
#sheet .row.dim { color: #6a6050; }
#sheet .head { margin-top: 10px; color: #6a6050; }
#sheet .plan { color: #4a5a2a; font-size: 13px; }
#sheet .done { color: #8a8070; text-decoration: line-through; font-size: 13px; }
#sheet button.need { text-align: left; border-style: dashed; }
#sheet button.need.soon { border-color: var(--rust); color: #7a3010; }
@media (max-width: 560px) { #log { font-size: 14px; max-height: 44vh; } #here .instruments { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }
</style>

<div class="col" id="stage">
  <div id="hud"><div class="place" id="hud-place"></div><div class="sub" id="hud-sub"></div><div id="hud-time"></div></div>
  <div id="hud-r"><div id="hud-energy"></div><div id="hud-money"></div></div>
  <div id="subs" hidden aria-live="polite"></div>
  <div id="toast" hidden role="status"></div>
  <div id="card" class="solid">
    <div class="time" id="card-time"></div>
    <h1 id="card-h">One Open Day</h1>
    <p id="card-p">Loading the Outer Sunset…</p>
    <div class="btns" id="card-btns"></div>
  </div>
</div>
<section class="col" id="panel">
  <div id="log" aria-live="polite"></div>
  <div id="here"></div>
  <form id="cmd" autocomplete="off">
    <div id="modes" role="group" aria-label="What kind of move">
      <button type="button" data-mode="say" aria-pressed="false" title="Talk to someone here (or start with a quote mark)">Say</button>
      <button type="button" data-mode="do" aria-pressed="true" title="Do something in the world">Do</button>
      <button type="button" data-mode="think" aria-pressed="false" title="Think it over. No time passes (or start with ?)">Think</button>
    </div>
    <input id="line" type="text" aria-label="Your move">
    <button id="go" type="submit" class="primary">Do</button>
  </form>
  <div id="note" aria-live="polite"></div>
</section>
<div class="col" id="controls">
  <div class="group">
    <button id="b-sound" aria-pressed="false">Sound</button>
    <button id="b-side" aria-pressed="false" title="See what people privately think of you (for testing)">Their side</button>
    <button id="b-grade" aria-pressed="true">Film</button>
  </div>
  <div class="group"><button id="b-restart">Start over</button></div>
</div>

<div id="scrim" hidden></div>
<div id="phone" hidden role="dialog" aria-label="Your phone">
  <div class="bar"><span id="p-clock">7:10</span><span>5G ▮▮▮</span></div>
  <div class="head"><button id="p-back" aria-label="Back to messages" hidden>‹</button><span class="spacer" id="p-spacer"></span><h2 id="p-title">Messages</h2><button id="p-close" aria-label="Put the phone away">×</button></div>
  <div id="contacts"></div>
  <div id="thread" hidden aria-live="polite"></div>
  <div id="phone-note" hidden></div>
  <form id="compose" hidden>
    <textarea id="draft" rows="1" placeholder="Text message" aria-label="Your message"></textarea>
    <button id="send" type="submit" aria-label="Send" disabled>↑</button>
  </form>
</div>
<div id="mapbox" hidden role="dialog" aria-label="Map of the Outer Sunset">
  <header><h2>The Outer Sunset</h2><button id="map-close">Close</button></header>
  <svg id="map-svg" viewBox="0 0 640 300" aria-hidden="true"></svg>
  <div id="map-list"></div>
</div>
<div id="thoughts" hidden></div>
<div id="sheet" hidden role="dialog" aria-labelledby="sheet-title">
  <header><h2 id="sheet-title"></h2><button id="sheet-close">Close</button></header>
  <div id="sheet-body"></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ---------- seeded random so the clutter is the same every visit ---------- */
let seed = 4747;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const rr = (a, b) => a + (b - a) * rnd();
const pick = a => a[Math.floor(rnd() * a.length)];

/* ---------- canvas texture helpers ---------- */
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function speckle(g, w, h, n, alpha, light) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = light ? `rgba(255,250,235,${rnd() * alpha})` : `rgba(40,25,10,${rnd() * alpha})`;
    g.fillRect(rnd() * w, rnd() * h, rr(1, 3), rr(1, 3));
  }
}

const tex = {
  floor: canvasTex(1024, 1024, (g, w, h) => {
    const rows = 8;
    for (let r = 0; r < rows; r++) {
      let x = -rnd() * 300;
      while (x < w) {
        const len = rr(260, 520), l = rr(-14, 10);
        g.fillStyle = `rgb(${150 + l},${108 + l},${70 + l * .8})`;
        g.fillRect(x, r * h / rows, len, h / rows);
        for (let k = 0; k < 18; k++) {
          g.strokeStyle = `rgba(80,50,25,${rr(.05, .18)})`; g.lineWidth = rr(.5, 2);
          const y = r * h / rows + rr(4, h / rows - 4);
          g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + len * .3, y + rr(-4, 4), x + len * .7, y + rr(-4, 4), x + len, y + rr(-3, 3)); g.stroke();
        }
        g.fillStyle = 'rgba(40,25,12,.55)'; g.fillRect(x, r * h / rows, 2, h / rows);
        x += len;
      }
      g.fillStyle = 'rgba(40,25,12,.5)'; g.fillRect(0, r * h / rows, w, 2);
    }
    speckle(g, w, h, 3000, .12);
  }, [3, 3]),
  wall: canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#d9cdb4'; g.fillRect(0, 0, w, h);

  const r = await direct('act', text);
  if (!r) { setBusy(false); you.querySelector('.tag').textContent = 'TRIED'; $('note').textContent = lastErr; return; }
  const can = r.possible !== false, mins = can ? Math.max(1, Math.min(240, Math.round(Number(r.minutes) || 5))) : 1;
  const clash = can ? clashes(S.min, S.min + mins) : [];
  if (can && (mins >= 20 || clash.length)) {
    const ok = await promptTx(`That would take about ${mins} minutes${clash.length ? ', and ' + clash.join('; ') : ''}.`, [['Do it', true, true], ['Not yet', false]]);
    if (!ok) { you.querySelector('.tag').textContent = 'CONSIDERED'; you.classList.add('considered'); setBusy(false); return; }
  }
  if (!can) { you.querySelector('.tag').textContent = 'TRIED'; you.classList.add('considered'); }
  applyScene(r, 'act');
  tx(can ? 'gm' : 'gm no', String(r.description || (can ? 'Done.' : "You can't, here and now.")).trim());
  advance(mins); S.energy = clamp(S.energy + (Number(r.energy) || 0), S.energy); hud();
  logIt(`${can ? 'Did' : 'Tried to'}: ${text.slice(0, 80)}. ${String(r.description || '').slice(0, 100)}`);
  placeFigures(); setBusy(false); renderActs(); save();
  if (can && (r.sleep === 'bed' || r.sleep === 'nap') && S.place === 'home') { await wait(1200); return rest(r.sleep === 'bed' ? 8 : 1); }
  if (can && PLACE_IDS.includes(r.go_to) && r.go_to !== S.place) { await wait(1200); return goTo(r.go_to); }
  await flushCards();
}

function applyObjects(r) {
  for (const o of (Array.isArray(r?.objects) ? r.objects : []).slice(0, 5)) {
    const id = String(o.id || o.name || '').toLowerCase().replace(/[^a-z0-9_-]/g, '-').slice(0, 30); if (!id) continue;
    const at = String(o.at || 'here').toLowerCase();
    if (at === 'gone') { delete S.objects[id]; continue; }
    const loc = at === 'here' ? S.place : at === 'player' ? 'player' : S.people[at] ? 'person:' + at : PLACE_IDS.includes(at) ? at : S.objects[at] ? 'in:' + at : S.place;
    S.objects[id] = { id, name: String(o.name || S.objects[id]?.name || id).slice(0, 50), at: loc, where: o.where ? String(o.where).slice(0, 60) : (S.objects[id]?.at === loc ? S.objects[id]?.where : '') };

/* ---------- the director ---------- */
const DIRECTOR = `You are the director of a slow, realistic life-simulation game shot like a 1970s verité film and set in the present day in San Francisco's Outer Sunset. You decide, honestly and specifically, what is going on where the player is.

${PLAYER}

RULES
- Ordinary life first. Most of the time: small, true texture (weather, light, sounds, regulars, odd little details, what things cost). About one time in three, add one hook: a person who might matter later, an opportunity, a small mystery, a chance to help or be helped. Never two big things at once.
- Respect the clock, the weather, opening hours (closed is closed) and who could plausibly be here at this hour.
- People recur. Known people may show up at their usual places. A new person gets a short lowercase id (a slug), a descriptive name until they introduce themselves ("woman with a red cart"), and a private one-line "who" with their real situation.
- Family members listed as here MUST be included in "present". Do not put family anywhere else.
- No melodrama, crime set pieces, chosen-one stuff or tidy resolutions. Never resolve loose ends for the player. Money is real.
- Tone: deadpan, mundane, a little weird, The Sims played straight. Never jokey. Present tense, second person.`;
const DIRECTOR_FORMAT = `Reply with ONLY one JSON object:
{"description": "what the player sees, hears and smells right now; 2 to 4 sentences, under 75 words",

 "text": null or {"from": "a known id who has the player's number", "text": "a text message they send now"} (rare),
 "needs_met": [ids of open needs that are now done because of what happened],
 "asks": [0 to 2 new things someone here now expects the player to do, each {"text": "short", "by": "HH:MM 24-hour or null"}],
 "agreements": [0 to 2 things people here have now agreed to go and do, each {"who": ["person ids", or "player"], "what": "short", "at": "HH:MM 24-hour or null for now", "minutes": how long, "to": "place id or null"}],

Objects listed as facts are facts. If something moved, report it in objects; if it isn't listed, you may establish it.`;

function applyScene(r, kind) {
  const present = [], forced = familyHere(S.place);
  const fromModel = Array.isArray(r?.present) && r.present.length > 0;
  for (const e of (fromModel ? r.present : []).slice(0, 4)) {
    const id = String(e.id || '').toLowerCase();
    const known = S.people[id];
    if (known?.fam && !forced.includes(id)) continue;                          // family can't be in two places
    if (['priya', 'school', 'halcyon'].includes(id)) continue;
    if (S.plans.some(pl => pl.status === 'underway' && pl.who.includes(id))) continue;   // people out doing what they agreed to are not here
    const p = ensurePerson(e); if (!p) continue;
    if (!known && e.look) p.look = e.look;
    present.push({ id: p.id, doing: String(e.doing || '').slice(0, 80), pose: ['stand', 'sit', 'phone'].includes(e.pose) ? e.pose : 'stand', says: e.says ? String(e.says).slice(0, 200) : null });
  }
  for (const id of forced) if (!present.find(p => p.id === id)) present.push({ id, doing: 'here', pose: 'stand', says: null });
  if (kind === 'act' && S.scene) { if (fromModel) S.scene.present = present; else S.scene.present = S.scene.present.filter(p => !S.people[p.id]?.fam || forced.includes(p.id)); }
  else {
    S.scene = { place: S.place, desc: String(r?.description || FALLBACK[S.place]).trim(), present };
    tx('place', `${PLACES[S.place].name} · ${weekday(S.day)}, ${fmt(S.min)}`);
    tx('desc', S.scene.desc);
  }
  if (r?.event) tx('event', String(r.event));
  applyObjects(r);
  const spend = Math.max(0, Math.min(500, Number(r?.spend) || 0)); if (spend) { S.spent += spend; S.balance -= spend; if (/coffee|latte|espresso/i.test(JSON.stringify(r))) S.energy = clamp(S.energy + 10, 0); }
  if (r?.thread) { const t = String(r.thread).slice(0, 80); if (!S.threads.includes(t)) S.threads.push(t); }
  if (r?.text?.from && S.people[r.text.from]?.hasNumber && r.text.text) textFrom(r.text.from, String(r.text.text));
  for (const m of (Array.isArray(r?.remembers) ? r.remembers : []).slice(0, 2)) if (S.people[m?.id]) remember(m.id, String(m.text || '').slice(0, 80));

}

const FEEL_RULES = `HOW YOU REACT (track two separate things)
- regard: what you think of the player. Honesty, humor, curiosity about your life and vulnerability raise it slowly. Cruelty, contempt, insulting people you love, being purely transactional or defensive drop it, sharply if it's an insult. Do not smooth things over to keep the peace: a real insult drops regard 15 to 30 points and it stays down; only a genuine, specific apology recovers some, never all.
- want_company: how much you want to keep talking / be around the player right now. It moves on its own track (loneliness, boredom, being busy).
- remembers: when something happens you would still think about next week, name it in a few words. You forgive in the moment more easily than you forget.

WHO YOU ARE
${p.bio || p.who}${p.facts?.length ? '\nThings you have already said about yourself (stay consistent): ' + p.facts.join('; ') + '.' : ''}

WHAT YOU KNOW ABOUT THE PLAYER
${playerKnown}
${p.memories.length ? 'What you remember about them: ' + p.memories.join('; ') + '.' : ''}
Your regard for the player: ${p.regard}. Your want_company: ${p.company}.

RIGHT NOW
${weekday(S.day)}, ${fmt(S.min)}. ${mode === 'text' ? `You are wherever you would be at this hour.` : `${PLACES[S.place].name}. ${scene}${others ? ' Also here: ' + others + '.' : ''}`} ${p.fam ? kidsLine() : ''}
${S.flags.halcyon && (p.fam || p.id === 'dev') ? '' : ''}
${ledgerText()}
The player is carrying: ${Object.values(S.objects).filter(o => o.at === 'player').map(o => o.name).join(', ') || 'nothing much'}. ${Object.values(S.objects).filter(o => o.at === 'person:' + p.id).map(o => 'You have: ' + o.name + '.').join(' ')}

${FEEL_RULES}

STYLE
${mode === 'text' ? 'Real texting: short, one to three messages, your own voice. No paragraphs.' : 'Real speech: short spoken sentences, one to three lines. No speeches, no therapist-speak.'} ${p.id === 'little' || p.id === 'big' ? 'You are a child; talk like one.' : ''}

THE CONVERSATION SO FAR (oldest first)
${transcript || '(nothing yet)'}

Reply with ONLY one JSON object:
{"lines": [0 to 3 short strings you say or text, in order],
 ${mode === 'text' ? '"read_after_seconds": 5 to 900,' : '"gesture": "none|drink|lean_in|lean_back|look_away|look_down|laugh|cross_arms|shrug",'}
 "regard": 0-100, "want_company": 0-100,
 "private_note": "one short first-person sentence you think but don't say",
 "remembers": null or a few words,
 "name": null or your first name if you have now told it to the player,
 "facts": [0 to 2 short facts you revealed about yourself],
 "gives_number": true if you just gave the player your number, else false,
 "thread": null or a loose end the player could follow up on later (a few words),
 "leaves": true if you are ending this conversation and going (or putting your phone down), else false,
 "agreements": [0 to 2 things that were just SETTLED to actually be done in the world (not merely discussed), each {"who": ["ids of who does it: your own id, other people's ids, and/or \"player\""], "what": "short, e.g. 'walk your little sibling to school'", "at": "HH:MM 24-hour when it starts, or null for right away", "minutes": how long it takes, "to": "place id or null"}],
 "asks": [0 to 2 things you now expect the player to do (a request you made or a promise they made you), each {"text": "short", "by": "HH:MM 24-hour or null"}],
 "needs_met": [ids of open needs that this conversation settled]}
Your id is "${p.id}". Do not repeat agreements or asks that are already open.`;
}

  if (r?.name && !p.fam && p.id !== 'dev' && p.id !== 'priya') { p.name = String(r.name).slice(0, 30); }
  for (const f of (Array.isArray(r?.facts) ? r.facts : []).slice(0, 2)) { const t = String(f).slice(0, 90); if (t && !p.facts.includes(t)) p.facts.push(t); }

  camState.pos.set(...st.cam.pos); camState.look.set(...st.cam.look); camState.fov = st.cam.fov;
}
function placeFigures() {
  for (const [, f] of figures) f.root.parent?.remove(f.root);
  figures.clear();
  const st = STAGES[stageKey]; if (!S.scene) return;
  const used = new Set();
  S.scene.present.forEach((pr, i) => {
    const npc = S.people[pr.id]; if (!npc) return;
    const staff = /barista|bartend|behind the (bar|counter)|making coffee|pouring/i.test(npc.name + ' ' + pr.doing);
    const ok = (s, k) => !used.has(k) && !!s.behindBar === staff;
    let si = st.slots.findIndex((s, k) => ok(s, k) && (pr.pose === 'sit' ? s.kind === 'sit' : s.kind !== 'sit'));
    if (si < 0) si = st.slots.findIndex((s, k) => ok(s, k)); if (si < 0) return; used.add(si);
    const slot = st.slots[si], kind = slot.kind;
    const f = figureFor(npc, kind); f.kind = kind;
    const sc = f.root.scale.x;
    f.root.position.set(slot.p[0], kind === 'sit' || slot.behindBar ? slot.p[1] : slot.p[1] + .87 * sc, slot.p[2]);
    const cp = st.cam.pos; f.root.rotation.y = slot.ry ?? Math.atan2(cp[0] - slot.p[0], cp[2] - slot.p[2]) + rr(-.5, .5);

function setFocus(id) { focusId = id; }
const camState = { pos: new THREE.Vector3(), look: new THREE.Vector3(), fov: 40, curPos: new THREE.Vector3(), curLook: new THREE.Vector3(), curFov: 40, init: false };
function updateCamera2(t, dt) {
  const st = STAGES[stageKey];
  let tp = camState.pos.clone(), tl = camState.look.clone(), tf = camState.fov;
  const f = focusId && figures.get(focusId);
  if (f) {   // during a conversation the camera drifts toward the person, over your shoulder
    const head = new THREE.Vector3(); f.head.getWorldPosition(head);

function animateStage(t, dt) {
  const camP = camera.position;

    const look = engaged ? camP.clone() : f.root.position.clone().add(new THREE.Vector3(Math.sin(f.root.rotation.y) * 3, f.base === 'phone' ? -.55 : .5, Math.cos(f.root.rotation.y) * 3));

  if (stageKey === 'street') { if (t > ST.njNext) { ST.nj.position.x = -80; ST.njNext = t + 55; } ST.nj.position.x += dt * 6; }
  if (stageKey === 'beach') {
    for (const f of BE.foam) { f.position.z += dt * f.userData.speed; f.material.opacity = Math.max(0, Math.min(.8, (f.position.z + 60) / 40)) * (f.position.z > -12 ? Math.max(0, (-9 - f.position.z) / 3) : 1); if (f.position.z > -9) f.position.z = -58; }
    BE.fire.scale.set(1 + Math.sin(t * 9) * .08, 1 + Math.sin(t * 13) * .15, 1); BE.fireL.intensity = BE.fire.visible ? (phaseOf(S.min) === 'night' ? 5 : 2) * (1 + Math.sin(t * 11) * .15) : 0;
  }

/* ---------- loop ---------- */
let lastNow = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(.1, (now - lastNow) / 1000); lastNow = now;
  animateStage(t, dt); updateCamera2(t, dt);
  const ph = phaseOf(S.min), P = PHASES[ph];
  film.uniforms.exposure.value = stageKey === 'interior' ? (stageDress === 'coffee' ? 1.1 : 1.2) : stageKey === 'condo' ? (ph === 'night' ? 1.15 : 1.05) : P.exposure;
  film.uniforms.sat.value = stageKey === 'interior' ? 1.0 : P.sat;
  film.uniforms.time.value = t;
  const wf = Math.floor(t * 24); film.uniforms.weave.value.set(Math.sin(wf * 1.7) * .0004, Math.sin(wf * 2.3) * .0006);
  renderer.setRenderTarget(rt); renderer.render(STAGES[stageKey].scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  requestAnimationFrame(loop);
}

/* ---------- wiring ---------- */
$('cmd').addEventListener('submit', e => { e.preventDefault(); submitLine($('line').value); });
// ? and " are one-line shortcuts: they show which kind of move this line is, without changing the box's mode
$('line').addEventListener('input', () => { const v = $('line').value, eff = v.startsWith('?') ? 'think' : /^["“]/.test(v) ? 'say' : mode; $('go').textContent = { say: 'Say', do: 'Do', think: 'Think' }[eff]; document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === eff)); });
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('sheet-close').onclick = closeSheet;
$('compose').addEventListener('submit', e => { e.preventDefault(); const v = $('draft').value; $('draft').value = ''; $('draft').style.height = ''; $('send').disabled = true; sendText(v); });
$('draft').addEventListener('input', () => { $('send').disabled = textBusy || !$('draft').value.trim(); $('draft').style.height = 'auto'; $('draft').style.height = $('draft').scrollHeight + 'px'; });

$('p-back').onclick = showContacts; $('p-close').onclick = closePhone; $('map-close').onclick = closeMap;
$('scrim').onclick = () => { closePhone(); closeMap(); closeSheet(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePhone(); closeMap(); closeSheet(); } });
$('b-sound').onclick = e => e.currentTarget.setAttribute('aria-pressed', audio.toggle());
$('b-grade').onclick = e => { const v = film.uniforms.gradeOn.value ? 0 : 1; film.uniforms.gradeOn.value = v; e.currentTarget.setAttribute('aria-pressed', !!v); };
$('b-side').onclick = e => { const on = $('thoughts').hidden; $('thoughts').hidden = !on; e.currentTarget.setAttribute('aria-pressed', on); renderSide(); };
$('b-restart').onclick = () => card('', 'Start over?', 'This erases your saved world: everyone you met and everything they remember.', [['Erase and start over', async () => { await wipeSave(); S = freshWorld(); begin(); }, true], ['Keep playing', hideCard]], true);

async function begin() {
  $('log').replaceChildren(); renderCmd();
  hideCard(); setStage('condo', null, true); hud(); setBusy(true, 'Morning.');
  logIt('Woke up.');
  const r = await direct('wake'); applyScene(r, 'arrive'); placeFigures(); setBusy(false); renderDesc(); renderActs(); save(); await flushCards();
}
async function boot() {
  resize(); setStage('condo', null, true); requestAnimationFrame(loop);
  const saved = await loadSave();
  const intro = `The Outer Sunset, present day. You are 47, a product manager with two kids, a wife who takes three buses to Marin, and a condo at 46th and Judah.\n\nNothing is required of you. Go where you want. People remember.`;
  if (saved && saved.v === 1 && saved.people) {
    card('', 'One Open Day', intro, [[`Continue: ${weekday(saved.day)}, ${fmt(saved.min)}`, async () => {
      S = saved; S.needs ||= []; S.plans ||= []; S.transcript ||= []; S.objects ||= freshWorld().objects; hideCard(); renderLog(); renderCmd(); setStage(PLACES[S.place].stage, PLACES[S.place].dress, true); hud();
      if (!S.scene || S.scene.place !== S.place) { setBusy(true, 'Picking up where you left off…'); const r = await direct('arrive'); applyScene(r, 'arrive'); setBusy(false); }
