<title>Outer Sunset, Interior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Libre+Franklin:wght@400;600&display=swap">
<style>
/* Layout: a letterboxed 1.85:1 film frame on black, with a slate-style control strip under it. Single dark look by choice (it's a screening room). */
:root {
  --black: #0b0a09;
  --frame: #000000;
  --slate: #e9e1cf;       /* typewritten slate text, warm paper white */
  --dim: #8d8473;
  --rust: #b5653a;        /* active marker, 70s burnt orange */
  --line: #2a2621;
  --slate-face: "Courier Prime", "Courier New", Courier, monospace;
  --ui-face: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--black); color: var(--slate);
  font-family: var(--ui-face);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-inline: 16px; gap: 14px; box-sizing: border-box; overflow: hidden;
}
#stage {
  position: relative; width: min(100%, calc((100vh - 120px) * 1.85)); aspect-ratio: 1.85 / 1;
  max-width: 100%; background: var(--frame);
}
#stage canvas { display: block; width: 100%; height: 100%; }
#slate {
  position: absolute; left: 3.2%; bottom: 6%; pointer-events: none;
  font-family: var(--slate-face); color: var(--slate); line-height: 1.35;
  font-size: clamp(10px, 1.45vw, 17px); letter-spacing: 0.04em;
  text-shadow: 0 1px 2px rgba(0,0,0,.55);
  transition: opacity 1.6s ease;
}
#slate .place { text-transform: uppercase; }
#slate .time { opacity: .85; }
#slate.hide { opacity: 0; }
#controls {
  width: min(100%, calc((100vh - 120px) * 1.85)); max-width: 100%;
  display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between;
  font-family: var(--slate-face); font-size: 13px; color: var(--dim);
  border-top: 1px solid var(--line); padding-top: 10px;
  position: relative; z-index: 7;
}
#controls .group { display: flex; gap: 6px; flex-wrap: wrap; }
button {
  font: inherit; color: var(--dim); background: transparent; border: 1px solid var(--line);
  padding: 6px 10px; cursor: pointer; letter-spacing: .05em; text-transform: uppercase;
}
button:hover { color: var(--slate); border-color: var(--dim); }
button:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
button[aria-pressed="true"] { color: var(--slate); border-color: var(--rust); }
#note { font-size: 12px; max-width: 46ch; }
@media (max-width: 520px) { #note { display: none; } }
@media (prefers-reduced-motion: reduce) { #slate { transition: none; } }

/* ---- the phone: the one cool, modern object in a 1970 frame ---- */
:root {
  --glass: #0c121b;
  --glass-2: #141c28;
  --phone-ink: #eef3ff;
  --phone-dim: #8995ab;
  --me: #2f6fdd;
  --them: #262c36;
}
.stage-btn {
  position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%);
  font-family: var(--slate-face); color: var(--slate); background: rgba(11,10,9,.55);
  border: 1px solid rgba(233,225,207,.35); padding: 8px 14px; letter-spacing: .08em;
  transition: opacity .8s ease;
}
.stage-btn:hover { border-color: var(--slate); color: var(--slate); }
#scrim {
  position: fixed; inset: 0; background: rgba(5,6,9,.55); z-index: 5;
  transition: opacity .6s ease;
}
#phone {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8;
  width: min(340px, calc(100vw - 32px)); height: min(660px, calc(100% - 32px));
  background: var(--glass); color: var(--phone-ink); border-radius: 38px;
  border: 7px solid #050608; box-shadow: 0 0 60px rgba(70,120,255,.28), 0 0 0 1px #2a3140;
  display: flex; flex-direction: column; overflow: hidden;
  font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
#phone .bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 22px 4px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
}
#phone .who {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 4px 0 10px; border-bottom: 1px solid #1e2532; background: var(--glass-2);
}
#phone .avatar {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(#7d8aa3, #4f5b72); font-weight: 600; font-size: 18px;
}
#phone .who span { font-size: 12px; color: var(--phone-dim); }
#thread {
  flex: 1; overflow-y: auto; padding: 12px 12px 6px; display: flex; flex-direction: column; gap: 3px;
  min-height: 0;
}
.day { text-align: center; font-size: 11px; color: var(--phone-dim); margin: 10px 0 6px; }
.msg {
  max-width: 76%; padding: 7px 12px; border-radius: 18px; font-size: 15px; line-height: 1.3;
  overflow-wrap: anywhere; white-space: pre-wrap;
}
.msg.them { align-self: flex-start; background: var(--them); }
.msg.me { align-self: flex-end; background: var(--me); color: #fff; }
.msg.me + .msg.them, .msg.them + .msg.me { margin-top: 8px; }
.receipt { align-self: flex-end; font-size: 11px; color: var(--phone-dim); margin: 2px 4px 4px; }
.typing { align-self: flex-start; background: var(--them); border-radius: 18px; padding: 10px 14px; display: flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--phone-dim); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 60%, 100% { opacity: .3 } 30% { opacity: 1 } }
#compose { display: flex; gap: 8px; padding: 8px 10px 6px; align-items: flex-end; }
#compose textarea {
  flex: 1; min-width: 0; resize: none; background: #1a212d; color: var(--phone-ink); border: 1px solid #2a3343;
  border-radius: 18px; padding: 8px 12px; font-size: 15px; line-height: 1.3; font-family: inherit; max-height: 96px;
}
#compose textarea:focus { outline: none; border-color: var(--me); }
#send {
  width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0; background: var(--me); color: #fff;
  font-size: 18px; line-height: 1; text-transform: none; flex: none;
}
#send:disabled { background: #2a3343; color: var(--phone-dim); cursor: default; }
#putdown {
  margin: 0 auto 10px; border: 0; color: var(--phone-dim); font-size: 12px; font-family: inherit;
  text-transform: none; letter-spacing: 0; padding: 6px;
}
#putdown:hover { color: var(--phone-ink); }
#phone-note { font-size: 12px; color: #f0b27a; text-align: center; padding: 0 16px 8px; }
#thoughts {
  position: fixed; z-index: 8; left: 16px; top: 16px; width: min(280px, calc(100vw - 32px));
  font-family: var(--slate-face); font-size: 13px; color: var(--slate); line-height: 1.4;
  background: rgba(11,10,9,.85); border: 1px solid var(--line); padding: 12px 14px;
}
#thoughts .meter { height: 4px; background: var(--line); margin: 6px 0 8px; }
#thoughts .meter b { display: block; height: 100%; background: var(--rust); transition: width .8s ease; }
#thoughts .label { color: var(--dim); text-transform: uppercase; font-size: 11px; letter-spacing: .08em; }
#ending {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end;
  gap: 14px; padding: 0 3.2% 6%; background: linear-gradient(transparent 40%, rgba(0,0,0,.6));
  font-family: var(--slate-face); color: var(--slate); font-size: clamp(13px, 1.7vw, 20px);
}
#ending .time { color: var(--dim); font-size: .8em; letter-spacing: .06em; }
#ending p { margin: 0; max-width: 40ch; text-wrap: balance; }
#ending button { font-size: 12px; }
</style>

<div id="stage">

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ---------- seeded random so the clutter is the same every visit ---------- */
let seed = 4747;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const rr = (a, b) => a + (b - a) * rnd();
const pick = a => a[Math.floor(rnd() * a.length)];

/* ---------- canvas texture helpers ---------- */
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function speckle(g, w, h, n, alpha, light) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = light ? `rgba(255,250,235,${rnd() * alpha})` : `rgba(40,25,10,${rnd() * alpha})`;
    g.fillRect(rnd() * w, rnd() * h, rr(1, 3), rr(1, 3));
  }
}

const tex = {
  floor: canvasTex(1024, 1024, (g, w, h) => {
    const rows = 8;
    for (let r = 0; r < rows; r++) {
      let x = -rnd() * 300;
      while (x < w) {
        const len = rr(260, 520), l = rr(-14, 10);
        g.fillStyle = `rgb(${150 + l},${108 + l},${70 + l * .8})`;
        g.fillRect(x, r * h / rows, len, h / rows);
        for (let k = 0; k < 18; k++) {
          g.strokeStyle = `rgba(80,50,25,${rr(.05, .18)})`; g.lineWidth = rr(.5, 2);
          const y = r * h / rows + rr(4, h / rows - 4);
          g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + len * .3, y + rr(-4, 4), x + len * .7, y + rr(-4, 4), x + len, y + rr(-3, 3)); g.stroke();
        }
        g.fillStyle = 'rgba(40,25,12,.55)'; g.fillRect(x, r * h / rows, 2, h / rows);
        x += len;
      }
      g.fillStyle = 'rgba(40,25,12,.5)'; g.fillRect(0, r * h / rows, w, 2);
    }
    speckle(g, w, h, 3000, .12);
  }, [3, 3]),
  wall: canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#d9cdb4'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      g.fillStyle = `rgba(${rnd() < .5 ? '120,100,70' : '255,248,230'},${rr(.01, .04)})`;
      g.beginPath(); g.arc(rnd() * w, rnd() * h, rr(10, 60), 0, 7); g.fill();
    }
    speckle(g, w, h, 1500, .05);
  }, [3, 2]),
  fabric: (base) => canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 2) { g.fillStyle = `rgba(0,0,0,${rr(.02, .08)})`; g.fillRect(0, y, w, 1); }
    for (let x = 0; x < w; x += 3) { g.fillStyle = `rgba(255,240,220,${rr(.01, .05)})`; g.fillRect(x, 0, 1, h); }
  }, [2, 2]),
  rug: canvasTex(512, 768, (g, w, h) => {
    g.fillStyle = '#b9a07a'; g.fillRect(0, 0, w, h);
    const cols = ['#8c4a2f', '#5e5a3a', '#c98d4f', '#3f3a35', '#d8c6a3'];
    g.lineWidth = 10;
    for (let i = 0; i < 9; i++) { g.strokeStyle = cols[i % cols.length]; g.strokeRect(18 + i * 13, 18 + i * 13, w - 36 - i * 26, h - 36 - i * 26); }
    for (let r = 0; r < 4; r++) for (let c = 0; c < 2; c++) {
      g.fillStyle = cols[(r + c) % 4]; const cx = 170 + c * 170, cy = 210 + r * 115;
      g.beginPath(); g.moveTo(cx, cy - 46); g.lineTo(cx + 46, cy); g.lineTo(cx, cy + 46); g.lineTo(cx - 46, cy); g.fill();
      g.fillStyle = '#d8c6a3'; g.beginPath(); g.moveTo(cx, cy - 16); g.lineTo(cx + 16, cy); g.lineTo(cx, cy + 16); g.lineTo(cx - 16, cy); g.fill();
    }
    speckle(g, w, h, 6000, .15); speckle(g, w, h, 3000, .08, true);
  }),
};

/* framed art: each one a small painting/print, generated */
const artMakers = [
  (g, w, h) => { g.fillStyle = '#e2d6bd'; g.fillRect(0, 0, w, h); // arcs, mid-century
    ['#b5653a', '#6e7449', '#d9a441', '#3e4a52'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(w * (.25 + i * .17), h * .72, w * (.32 - i * .05), Math.PI, 0); g.fill(); }); },
  (g, w, h) => { g.fillStyle = '#a7a28f'; g.fillRect(0, 0, w, h); // Ocean Beach photo, fog
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#c9c6bb'); gr.addColorStop(.55, '#a9aaa1'); gr.addColorStop(.62, '#7c8079'); gr.addColorStop(1, '#b8a98a');
    g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(240,240,232,.6)'; for (let i = 0; i < 6; i++) g.fillRect(0, h * (.62 + i * .025), w, 2);
    g.fillStyle = '#2b2a27'; g.fillRect(w * .62, h * .7, 5, 18); g.fillRect(w * .66, h * .72, 4, 13); },
  (g, w, h) => { g.fillStyle = '#efe7d6'; g.fillRect(0, 0, w, h); // botanical
    g.strokeStyle = '#4f5a33'; g.lineWidth = 3; g.beginPath(); g.moveTo(w / 2, h * .9); g.quadraticCurveTo(w * .45, h * .5, w * .55, h * .12); g.stroke();
    for (let i = 0; i < 9; i++) { g.fillStyle = i % 2 ? '#6b7a40' : '#57652f'; g.save(); g.translate(w * (.5 + (i % 2 ? .02 : -.02)), h * (.85 - i * .08)); g.rotate(i % 2 ? .9 : -.9); g.beginPath(); g.ellipse(18, 0, 22, 8, 0, 0, 7); g.fill(); g.restore(); }
    g.fillStyle = '#6d6252'; g.font = '14px serif'; g.fillText('Ficus lyrata', w * .3, h * .96); },
  (g, w, h) => { g.fillStyle = '#f6f1e4'; g.fillRect(0, 0, w, h); // kid drawing: house, sun, family of 4
    g.lineWidth = 5; g.strokeStyle = '#2f6db0'; g.strokeRect(w * .25, h * .45, w * .5, h * .38); g.beginPath(); g.moveTo(w * .2, h * .47); g.lineTo(w * .5, h * .2); g.lineTo(w * .8, h * .47); g.strokeStyle = '#c23b2a'; g.stroke();
    g.fillStyle = '#f2b51d'; g.beginPath(); g.arc(w * .85, h * .14, 26, 0, 7); g.fill();
    g.strokeStyle = '#222'; g.lineWidth = 3; [.12, .2, .86, .92].forEach((x, i) => { const s = i % 2 ? .7 : 1; g.beginPath(); g.arc(w * x, h * (.74 + (1 - s) * .1), 8 * s, 0, 7); g.moveTo(w * x, h * (.78 + (1 - s) * .1)); g.lineTo(w * x, h * .92); g.stroke(); }); },
  (g, w, h) => { g.fillStyle = '#2f3a3f'; g.fillRect(0, 0, w, h); // risograph-ish poster
    g.fillStyle = '#d9a441'; g.fillRect(w * .1, h * .1, w * .8, h * .5); g.fillStyle = '#b5653a'; g.beginPath(); g.arc(w * .5, h * .6, w * .28, 0, 7); g.fill();
    g.fillStyle = '#efe7d6'; g.font = 'bold 26px sans-serif'; g.fillText('SUTRO', w * .12, h * .9); },
  (g, w, h) => { g.fillStyle = '#d8cfbd'; g.fillRect(0, 0, w, h); // abstract brush
    for (let i = 0; i < 7; i++) { g.strokeStyle = pick(['#3e4a52', '#8c4a2f', '#6e7449', '#1f1d1a']); g.lineWidth = rr(6, 22); g.beginPath(); g.moveTo(rr(0, w), rr(0, h)); g.bezierCurveTo(rr(0, w), rr(0, h), rr(0, w), rr(0, h), rr(0, w), rr(0, h)); g.stroke(); } },
  (g, w, h) => { g.fillStyle = '#c7b48f'; g.fillRect(0, 0, w, h); // map of the avenues
    g.strokeStyle = 'rgba(60,45,30,.6)'; g.lineWidth = 2; for (let i = 0; i < 12; i++) { g.beginPath(); g.moveTo(i * w / 11, 0); g.lineTo(i * w / 11, h); g.stroke(); }
    for (let i = 0; i < 8; i++) { g.beginPath(); g.moveTo(0, i * h / 7); g.lineTo(w, i * h / 7); g.stroke(); }
    g.fillStyle = '#5d7480'; g.fillRect(w * .9, 0, w * .1, h); },
];
function artTex(i) { return canvasTex(256, 320, (g, w, h) => { artMakers[i % artMakers.length](g, w, h); speckle(g, w, h, 600, .08); }); }

/* ---------- screens (phone + laptops) ---------- */
function phoneTex() {
  return canvasTex(512, 1024, (g, w, h) => {
    g.fillStyle = '#0d1420'; g.fillRect(0, 0, w, h);
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#24406a'); gr.addColorStop(1, '#0d1726');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = '#eaf1ff'; g.textAlign = 'center';
    g.font = '300 150px Helvetica, Arial, sans-serif'; g.fillText('11:52', w / 2, 250);
    g.font = '30px Helvetica, Arial, sans-serif'; g.fillText('Wednesday, October 14', w / 2, 300);
    const card = (y, app, when, title, body) => {
      g.fillStyle = 'rgba(220,232,255,.18)'; g.beginPath(); g.roundRect(26, y, w - 52, 190, 26); g.fill();
      g.textAlign = 'left'; g.fillStyle = 'rgba(234,241,255,.7)'; g.font = '24px Helvetica, Arial, sans-serif';
      g.fillText(app, 52, y + 42); g.textAlign = 'right'; g.fillText(when, w - 52, y + 42); g.textAlign = 'left';
      g.fillStyle = '#f4f8ff'; g.font = 'bold 34px Helvetica, Arial, sans-serif'; g.fillText(title, 52, y + 86);
      g.font = '29px Helvetica, Arial, sans-serif'; g.fillStyle = 'rgba(244,248,255,.86)';
      body.forEach((l, i) => g.fillText(l, 52, y + 128 + i * 36));
    };
    card(380, 'MAIL', '11:48 PM', 'Re: Product Manager, Agents', ['Thank you for the time you spent', 'with our team. After careful…']);
    card(590, 'NOTES', 'now', 'can we retire?', ['5.9M × 3.5% = 206k/yr', 'mortgage + 2 kids + SF = ?']);
    card(800, 'MESSAGES', '10:15 PM', 'Dev', ['lol we\'re hiring again. want', 'me to put your name in?']);
  });
}
function laptopTex(kind) {
  return canvasTex(512, 320, (g, w, h) => {
    if (kind === 'work') {
      g.fillStyle = '#f3f0ea'; g.fillRect(0, 0, w, h); g.fillStyle = '#3d2a3c'; g.fillRect(0, 0, 110, h);
      g.fillStyle = 'rgba(255,255,255,.55)'; g.font = '13px Arial';
      ['# roadmap-q4', '# pm-sync', '# random', '# launch-war-room', '# design-crit'].forEach((s, i) => g.fillText(s, 10, 40 + i * 24));
      for (let i = 0; i < 7; i++) { g.fillStyle = pick(['#7a8c5c', '#b5653a', '#4b6584', '#9c7a4f']); g.fillRect(125, 22 + i * 40, 22, 22);
        g.fillStyle = '#333'; g.font = 'bold 12px Arial'; g.fillText(pick(['Priya', 'Marcus', 'Jen', 'Tomás']), 155, 32 + i * 40);
        g.fillStyle = '#666'; g.font = '12px Arial'; g.fillText(pick(['can we push this to next sprint?', 'circling back on the PRD', '+1', 'who owns this?', 'let\'s take it offline']), 155, 48 + i * 40); }
    } else { // the kid's vibe-coded game
      g.fillStyle = '#141018'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#f2b51d'; g.font = 'bold 30px monospace'; g.fillText('SPACE TACO 3', 120, 60);
      for (let i = 0; i < 40; i++) { g.fillStyle = '#fff'; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
      g.fillStyle = '#c23b2a'; g.beginPath(); g.moveTo(240, 220); g.lineTo(270, 270); g.lineTo(210, 270); g.fill();
      g.fillStyle = '#7ec850'; g.fillRect(150, 120, 30, 20); g.fillRect(320, 150, 30, 20);
      g.fillStyle = '#aaa'; g.font = '14px monospace'; g.fillText('SCORE 0042   LIVES ♥♥♥', 150, 300);
    }
  });
}

function leafCluster(x, y, z, n, spread, size, parent = scene) {
  const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g);
  for (let i = 0; i < n; i++) {
    const l = new THREE.Mesh(new THREE.SphereGeometry(size * rr(.7, 1.2), 8, 6), M(pick(['#4f5a33', '#5d6b3a', '#3f4a2c', '#6b7a40', '#4a5a3a']), { roughness: .7 }));
    l.scale.set(1, .35, .6); l.position.set(rr(-spread, spread), rr(0, spread * 1.6), rr(-spread, spread));
    l.rotation.set(rr(-1, 1), rr(0, 3), rr(-1, 1)); l.castShadow = true; g.add(l);
  }
  return g;
}

  lapWork.g.visible = !night;                          // work laptop put away

  lapKid.scr.visible = !night;
  wine.visible = night; stub.visible = night; mug.visible = !night;
  fl.visible = true;

  document.getElementById('b-night').setAttribute('aria-pressed', night);

  sl.querySelector('.place').textContent = s.place; sl.querySelector('.time').textContent = s.time;
  sl.classList.remove('hide'); clearTimeout(sl._t); sl._t = setTimeout(() => sl.classList.add('hide'), 7000);
  audio.setScene(name);
}

/* ---------- film pass: grade, halation, grain, weave ---------- */
const rt = new THREE.WebGLRenderTarget(16, 16, { type: THREE.HalfFloatType, samples: 4 });
const film = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: rt.texture }, res: { value: new THREE.Vector2(16, 16) }, time: { value: 0 }, exposure: { value: 1 }, sat: { value: 1.18 }, gradeOn: { value: 1 }, weave: { value: new THREE.Vector2() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `
    precision highp float; varying vec2 vUv;
    uniform sampler2D tDiffuse; uniform vec2 res; uniform float time, exposure, sat, gradeOn; uniform vec2 weave;
    float hash(vec2 p){ p = fract(p*vec2(443.897,441.423)); p += dot(p, p.yx+19.19); return fract((p.x+p.y)*p.x); }
    vec3 tex(vec2 uv){ return texture2D(tDiffuse, uv).rgb; }
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
    vec3 toSRGB(vec3 c){ return mix(c*12.92, 1.055*pow(c, vec3(1./2.4))-.055, step(.0031308, c)); }
    void main(){
      vec2 uv = vUv;
      if (gradeOn < .5) { gl_FragColor = vec4(toSRGB(aces(tex(uv)*exposure)), 1.); return; }
      uv += weave;
      vec2 px = 1./res;
      vec3 c = tex(uv);
      // lens softness: the old zooms were never razor sharp
      vec3 soft = (tex(uv+vec2(px.x,0.))+tex(uv-vec2(px.x,0.))+tex(uv+vec2(0.,px.y))+tex(uv-vec2(0.,px.y)))*.25;
      c = mix(c, soft, .22);
      // halation: bright things bleed a warm red-orange
      vec3 hal = vec3(0.); float tot = 0.;
      for (int i = 0; i < 12; i++) { float a = float(i)*.5236; for (int r = 1; r <= 2; r++) {
        vec3 s = tex(uv + vec2(cos(a), sin(a))*px*float(r)*7.); hal += max(s - .75, 0.); tot += 1.; } }
      hal /= tot; c += hal * vec3(1.2, .45, .2) * .8;
      c *= exposure * (1. + (hash(vec2(floor(time*24.), 3.)) - .5) * .025);
      // protect saturated blue (the phone) from the grade
      float blue = clamp((c.b - max(c.r, c.g)) * 2.5 - .3, 0., 1.);
      vec3 m = aces(c);
      float l = dot(m, vec3(.2126,.7152,.0722));
      // Eastmancolor print: rich color, real blacks, warm-clean whites
      vec3 graded = mix(vec3(l), m, sat);                   // saturated stock
      graded = max(graded, 0.);
      graded *= vec3(1.03, 1.0, .93);                       // gentle warm balance
      graded = mix(graded, graded * vec3(1.02, 1.0, .9), smoothstep(.0, .45, 1.-l)*.35); // a little warmth in shadows
      graded = graded * graded * (3. - 2. * graded) * .35 + graded * .65; // print S-curve: deeper blacks, firm mids
      graded = mix(vec3(.012,.01,.008), vec3(.985,.97,.93), graded);     // barely lifted blacks, warm-white top
      m = mix(graded, m * vec3(.85, .95, 1.1), blue * .85);
      // vignette
      vec2 d = vUv - .5; m *= 1. - dot(d, d) * .4;
      vec3 o = toSRGB(clamp(m, 0., 1.));
      // grain (in display space so it sits on top like real stock)
      float g = hash(vUv * res + fract(time * 24.) * 97.) - .5;
      float g2 = hash(vUv * res * .5 + fract(time * 24.) * 41.) - .5;
      o += (g * .6 + g2 * .4) * mix(.05, .025, l);
      gl_FragColor = vec4(o, 1.);
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene(), postCam = new THREE.Camera();
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), film));

function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  const pr = renderer.getPixelRatio();
  rt.setSize(Math.floor(r.width * pr), Math.floor(r.height * pr));
  film.uniforms.res.value.set(r.width * pr, r.height * pr);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

/* ---------- handheld verité camera with a slow zoom ---------- */
const v3 = (a) => new THREE.Vector3(...a);
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
let timeOffset = 0; // for screenshots: window.__jump(seconds)
function updateCamera(t) {
  const s = SCENES[current];
  let look = v3(s.cam.look), fov = s.cam.fov;
  if (s.zoomTo) {
    const delay = 5, k = ease(Math.min(1, Math.max(0, (t - delay) / s.zoomTo.seconds)));
    look.lerp(v3(s.zoomTo.look), Math.min(1, k * 1.6)); fov = THREE.MathUtils.lerp(fov, s.zoomTo.fov, k);
  }
  const amp = 0.012 * (fov / 46) + .002;  // handheld: breathing + small drift, scaled down as we zoom
  const n = (f, p) => Math.sin(t * f + p);
  const pos = v3(s.cam.pos).add(new THREE.Vector3(n(.31, 1) * .02 + n(.73, 2) * .008, n(.27, 3) * .012 + n(1.1, 5) * .004, n(.19, 4) * .015));
  camera.position.copy(pos); camera.fov = fov; camera.updateProjectionMatrix();
  camera.lookAt(look.add(new THREE.Vector3(n(.41, 6), n(.37, 7), 0).multiplyScalar(amp * 3)));
  camera.rotateZ((n(.23, 8) * .006 + n(.61, 9) * .002));
}

/* ---------- ambient sound, synthesized: fridge, fog, foghorn, the N-Judah ---------- */
const audio = (() => {
  let ctx, master, layers = {}, on = false, scene = 'day', timers = [];
  function noise(color) {
    const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = color === 'brown' ? (last + .02 * w) / 1.02 : w; d[i] = color === 'brown' ? last * 3.5 : w; }
    const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s;
  }
  function gain(v, to) { const g = ctx.createGain(); g.gain.value = v; g.connect(to || master); return g; }
  function build() {
    ctx = new (window.AudioContext || window.webkitAudioContext)(); master = gain(0, ctx.destination);
    // fridge hum from the kitchen
    const hum = gain(.025); [60, 120, 180].forEach((f, i) => { const o = ctx.createOscillator(); o.frequency.value = f; const g = gain([.6, .3, .1][i], hum); o.connect(g); o.start(); });
    layers.hum = hum;
    // the city through the window: wind, distant traffic, surf
    const city = gain(.0); const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500; lp.connect(city); noise('brown').connect(lp); layers.city = city;
    const hiss = gain(0); const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .4; bp.connect(hiss); noise('white').connect(bp); layers.hiss = hiss;
    // radio next door (day): band-limited murmur that rises and falls
    const radio = gain(0); const rbp = ctx.createBiquadFilter(); rbp.type = 'bandpass'; rbp.frequency.value = 650; rbp.Q.value = 3; rbp.connect(radio);
    const rn = noise('white'); const mod = ctx.createGain(); mod.gain.value = .5; rn.connect(mod); mod.connect(rbp);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 3.2; const lg = ctx.createGain(); lg.gain.value = .45; lfo.connect(lg); lg.connect(mod.gain); lfo.start(); layers.radio = radio;
  }
  function foghorn() {
    if (!on) return; const t = ctx.currentTime, g = gain(0);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; lp.connect(g);
    [[0, 175], [2.2, 140]].forEach(([dt, f]) => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; const og = ctx.createGain(); og.gain.setValueAtTime(0, t + dt); og.gain.linearRampToValueAtTime(1, t + dt + .4); og.gain.setValueAtTime(1, t + dt + 1.7); og.gain.linearRampToValueAtTime(0, t + dt + 2.1); o.connect(og); og.connect(lp); o.start(t + dt); o.stop(t + dt + 2.3); });
    g.gain.value = scene === 'night' ? .05 : .03;
  }
  function train() { // the N-Judah, far off: a rising whine and a rumble
    if (!on) return; const t = ctx.currentTime, g = gain(0);
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(380, t); o.frequency.linearRampToValueAtTime(520, t + 5); o.frequency.linearRampToValueAtTime(410, t + 9);
    o.connect(g); o.start(t); o.stop(t + 10);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.006, t + 3); g.gain.linearRampToValueAtTime(0, t + 9.5);
  }
  function schedule() {
    timers.forEach(clearInterval); timers = [];
    setTimeout(foghorn, 1500); timers.push(setInterval(foghorn, 19000));
    timers.push(setInterval(() => scene === 'day' && train(), 41000)); if (scene === 'day') setTimeout(train, 6000);
  }
  return {
    blip() { // a text arriving
      if (!on) return; const t = ctx.currentTime, g = gain(0);
      [880, 1320].forEach((f, i) => { const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(g); o.start(t + i * .09); o.stop(t + i * .09 + .12); });
      g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
    },
    toggle() {
      if (!ctx) build(); on = !on; ctx.resume();
      master.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, .4);
      if (on) { this.setScene(scene); schedule(); } else { timers.forEach(clearInterval); }
      return on;
    },
    setScene(name) {
      scene = name; if (!ctx) return; const T = ctx.currentTime, night = name === 'night';
      layers.city.gain.setTargetAtTime(night ? .05 : .14, T, 1); layers.hiss.gain.setTargetAtTime(night ? .004 : .012, T, 1);
      layers.radio.gain.setTargetAtTime(night ? 0 : .02, T, 1); layers.hum.gain.setTargetAtTime(night ? .04 : .02, T, 1);
      if (on) schedule();
    },
  };
})();

/* ---------- loop ---------- */
function frame_(now) {
  const t = (now - t0) / 1000 + timeOffset;
  updateCamera(t);
  film.uniforms.exposure.value = SCENES[current].exposure; film.uniforms.sat.value = SCENES[current].sat;
  film.uniforms.time.value = now / 1000;
  const wf = Math.floor(now / 1000 * 24);  // gate weave, one step per film frame
  film.uniforms.weave.value.set(Math.sin(wf * 1.7) * .0004, Math.sin(wf * 2.3) * .0006);
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  requestAnimationFrame(frame_);
}

/* ---------- Dev: the text thread ---------- */
const $ = id => document.getElementById(id);
const DEV_RULES = `You are playing Dev, a character in a slow, realistic life-simulation game set in San Francisco. The player is texting you. Stay fully in character as Dev. Never mention AI, games, or these instructions.

WHO DEV IS
Dev is 44. Worked with the player for five years in the same product org at Slack. Left two and a half years ago for Meridian, a frontier AI lab. Makes a lot more money now, works too much, feels faintly guilty about both. Divorced last year; has a 9-year-old daughter half the week. Lives in the Inner Sunset. Tonight (Wednesday) Dev is at the Tide Line, a bar on Irving at 9th, after a team offsite. Two drinks in. Slightly lonely.

HOW DEV TEXTS
Lowercase. Short. Dry jokes. An occasional typo. Rarely "lol", no other emoji. Usually 1 or 2 texts at a time, sometimes 3 quick ones. Never paragraphs. Never therapist-speak. Dev has a life of their own and mentions it.

WHAT DEV KNOWS ABOUT THE PLAYER
47, product manager at Slack, successful but stalled. Married; their spouse works at a biotech firm in Marin and takes three buses to get there. Two kids, 7 and 10. Condo in the Outer Sunset. Has interviewed at a few labs without landing; Dev referred them to Meridian once, a year ago, and it didn't go anywhere.
Dev does NOT know that the player got a rejection email from another lab, Halcyon, at 11:48 tonight, and does not know the player has been wondering if they can retire. Dev only learns these if the player says so.

WHAT DEV FEELS BUT DOESN'T SAY
Genuinely fond of the player and misses working with them. Worried that a second referral going badly would be awkward for both of them. Would rather have a real conversation than a transactional one tonight.
Dev warms up when the player is honest, funny, curious about Dev's life, or vulnerable. Dev cools when the player is purely transactional, defensive, passive-aggressive about money or success, or sends walls of text.
If things get warm, Dev may invite the player to come down to the Tide Line (about 25 blocks away; the N-Judah still runs). If it fizzles, Dev says goodnight. If it goes badly, Dev may just stop replying. It's nearly midnight; this shouldn't go on forever.

REPLY FORMAT
Reply with ONLY one JSON object, no other text:
{"read_after_seconds": integer from 5 to 900, how long before Dev reads the player's latest message (fast when engaged; slow when busy at the bar or put off),
 "messages": array of 0 to 3 strings, Dev's texts in order ([] means Dev read it and didn't reply),
 "warmth": integer 0 to 100, how Dev feels about the player right now,
 "private_note": one short first-person sentence of what Dev is really thinking and not saying,
 "ending": null, or "invite" (Dev asked them to come out and they agreed or are going), or "goodnight" (the conversation wound down), or "left_on_read" (Dev has stopped replying for the night),
 "ending_line": null unless ending is set; then a film-slate caption of what the player does next: second person, present tense, under 14 words, plain and concrete, e.g. "You find your shoes in the dark and check the N-Judah times."}
Only set ending when the conversation has truly reached that point.`;

const HISTORY = [
  { day: 'Saturday' },
  { from: 'me', text: 'taking the kids somewhere tomorrow. randall museum again or is there a better move' },
  { from: 'them', text: 'musée mécanique. trust me' },
  { from: 'them', text: 'bring like $20 in quarters' },
  { from: 'me', text: 'the fortune teller scared the 7 year old. 10/10' },
  { day: 'Today 10:15 PM' },
  { from: 'them', text: "lol we're hiring again. want me to put your name in?" },
];

const chat = { turns: [], warmth: 62, minutes: 0, busy: false, over: false, sample: undefined, ctl: null };
let sampleReady = (async () => {
  try { chat.sample = window.claude?.use ? await window.claude.use('sample') : null; } catch { chat.sample = null; }
  return chat.sample;
})();

function clockText() {
  const m = 52 + chat.minutes, h = 11 + Math.floor(m / 60), mm = m % 60;
  const hh = ((h - 1) % 12) + 1, ap = h >= 12 && h < 24 ? 'A.M.' : 'P.M.';
  return { short: `${hh}:${String(mm).padStart(2, '0')}`, long: `${hh}:${String(mm).padStart(2, '0')} ${ap}` };
}
function addEl(cls, text, tag = 'div') {
  const el = document.createElement(tag); el.className = cls; if (text) el.textContent = text;
  $('thread').append(el); $('thread').scrollTop = $('thread').scrollHeight; return el;
}
function renderHistory() {
  $('thread').replaceChildren();
  for (const h of HISTORY) h.day ? addEl('day', h.day) : addEl('msg ' + h.from, h.text);
}
function setThoughts(note) {
  $('thoughts').querySelector('.meter b').style.width = chat.warmth + '%';
  if (note) $('thought-text').textContent = note;
}
function phoneNote(text) { $('phone-note').hidden = !text; $('phone-note').textContent = text || ''; }

async function openPhone() {
  $('pickup').hidden = true; $('scrim').hidden = false; $('phone').hidden = false;
  $('clock').textContent = clockText().short;
  if (!$('thread').childElementCount) renderHistory();
  $('draft').focus();
  const s = await sampleReady;
  if (!s) { phoneNote("Dev can't answer in this view. Open this page on claude.ai, signed in, to text them."); }
}
function closePhone() { $('scrim').hidden = true; $('phone').hidden = true; }

function endNight(line) {
  chat.over = true; chat.ctl?.abort(); closePhone();
  $('pickup').hidden = true;
  $('ending').querySelector('.time').textContent = clockText().long;
  $('ending').querySelector('p').textContent = line;
  $('ending').hidden = false;
}
function resetNight() {
  chat.ctl?.abort();
  Object.assign(chat, { turns: [], warmth: 62, minutes: 0, busy: false, over: false });
  $('ending').hidden = true; $('thread').replaceChildren(); phoneNote('');
  $('draft').value = ''; $('send').disabled = true; $('draft').disabled = false;
  setThoughts("Haven't heard back yet."); $('pickup').hidden = true;
}

function transcript() {
  const lines = HISTORY.filter(h => !h.day).map(h => (h.from === 'me' ? 'PLAYER: ' : 'DEV: ') + h.text);
  for (const t of chat.turns) lines.push((t.from === 'me' ? 'PLAYER: ' : 'DEV: ') + t.text);
  return lines.join('\n');
}

async function send(text) {
  if (chat.busy || chat.over || !text.trim()) return;
  const s = await sampleReady;
  if (!s) { phoneNote("Dev can't answer in this view. Open this page on claude.ai, signed in, to text them."); return; }
  chat.busy = true; $('send').disabled = true;
  chat.minutes += 1; $('clock').textContent = clockText().short;
  addEl('msg me', text); chat.turns.push({ from: 'me', text });
  const receipt = addEl('receipt', 'Delivered');
  const nMine = chat.turns.filter(t => t.from === 'me').length;
  const prompt = `${DEV_RULES}

It is ${clockText().long} on Wednesday. Dev's warmth toward the player before this message: ${chat.warmth}.${nMine >= 9 ? '\nThe conversation has gone on a while. Wind it toward an ending now.' : ''}

THE THREAD SO FAR (oldest first):
${transcript()}

Reply as Dev to the player's latest message, as JSON only.`;
  chat.ctl = new AbortController();
  let r;
  try {
    r = await s.json(prompt, { cache: false, signal: chat.ctl.signal });
  } catch (e) {
    chat.busy = false; $('send').disabled = !$('draft').value.trim();
    if (e.code === 'cancelled') return;
    receipt.textContent = 'Not delivered';
    const copy = {
      not_granted: "Texting Dev needs your OK to use Claude. Reload the page to be asked again.",
      sampling_disabled: "Claude isn't available on this account, so Dev can't reply.",
      rate_limited: "Too many messages too fast. Wait a minute, then send again.",
      session_expired: "You've been signed out of Claude. Sign in again, then send.",
      refused: "That message didn't go through. Try saying it another way.",
    }[e.code] || "The message didn't go through. Send it again.";
    phoneNote(copy);
    chat.turns.pop(); return;
  }
  phoneNote('');
  const msgs = Array.isArray(r?.messages) ? r.messages.map(String).filter(m => m.trim()).slice(0, 3) : [];
  const readAfter = Math.max(5, Math.min(900, Number(r?.read_after_seconds) || 30));
  chat.warmth = Math.max(0, Math.min(100, Math.round(Number(r?.warmth) || chat.warmth)));
  setThoughts(String(r?.private_note || ''));

  // Read receipt, then typing, then texts arrive one by one.
  chat.minutes += Math.round(readAfter / 60);
  const wait = ms => new Promise(res => setTimeout(res, ms));
  await wait(Math.min(4000, 600 + readAfter * 8));
  if (chat.over) return;
  $('clock').textContent = clockText().short;
  receipt.textContent = 'Read ' + clockText().short;
  for (const m of msgs) {
    const typing = addEl('typing'); typing.innerHTML = '<i></i><i></i><i></i>';
    await wait(Math.min(3500, 700 + m.length * 45));
    typing.remove(); if (chat.over) return;
    addEl('msg them', m); chat.turns.push({ from: 'them', text: m }); audio.blip();
    await wait(350);
  }
  chat.busy = false; $('send').disabled = !$('draft').value.trim();

  const ending = ['invite', 'goodnight', 'left_on_read'].includes(r?.ending) ? r.ending : null;
  if (ending) {
    $('draft').disabled = true; $('send').disabled = true;
    const fallback = { invite: 'You find your shoes in the dark.', goodnight: 'You plug in the phone and turn off the lamp.', left_on_read: 'You watch the screen until it goes dark.' }[ending];
    await wait(ending === 'left_on_read' ? 2500 : 4500);
    if (!chat.over) endNight(String(r?.ending_line || fallback));
  }
}

$('compose').addEventListener('submit', e => { e.preventDefault(); const v = $('draft').value; $('draft').value = ''; $('draft').style.height = ''; $('send').disabled = true; send(v); });
$('draft').addEventListener('input', () => {
  $('send').disabled = chat.busy || !$('draft').value.trim();
  $('draft').style.height = 'auto'; $('draft').style.height = $('draft').scrollHeight + 'px';
});
$('draft').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('compose').requestSubmit(); } });
$('pickup').onclick = openPhone;
$('putdown').onclick = () => endNight(chat.turns.length ? 'You set the phone face down. The fridge hums.' : 'You turn the phone face down without answering. The fridge hums.');
$('again').onclick = () => { resetNight(); setScene('night'); };
$('scrim').onclick = () => { closePhone(); if (!chat.over) $('pickup').hidden = false; };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('phone').hidden) $('scrim').onclick(); });
$('b-thoughts').onclick = e => { const on = $('thoughts').hidden; $('thoughts').hidden = !on; e.currentTarget.setAttribute('aria-pressed', on); };

// At night, the phone becomes something you can pick up once the zoom has had a moment.
let pickupTimer;
function goTo(name) {
  setScene(name); clearTimeout(pickupTimer); closePhone();
  if (name === 'day') { $('pickup').hidden = true; $('ending').hidden = true; return; }
  if (chat.over) resetNight();
  pickupTimer = setTimeout(() => { if (current === 'night' && !chat.over && $('phone').hidden) $('pickup').hidden = false; }, 9000);
}
window.__goTo = goTo;

document.getElementById('b-day').onclick = () => goTo('day');
document.getElementById('b-night').onclick = () => goTo('night');
document.getElementById('b-sound').onclick = e => e.currentTarget.setAttribute('aria-pressed', audio.toggle());
document.getElementById('b-grade').onclick = e => { const v = film.uniforms.gradeOn.value ? 0 : 1; film.uniforms.gradeOn.value = v; e.currentTarget.setAttribute('aria-pressed', !!v); };
window.__jump = s => { timeOffset = s; };
window.__scene = setScene;

resize();
goTo(location.hash === '#night' ? 'night' : 'day');
requestAnimationFrame(frame_);
</script>
